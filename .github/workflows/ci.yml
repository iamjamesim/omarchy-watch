name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate manifest
        run: |
          jq -e '
            .schemaVersion == 1
            and (.id | type == "string" and length > 0)
            and (.name | type == "string" and length > 0)
            and (.version | type == "string" and length > 0)
            and (.kinds | index("bar-widget") != null)
            and (.entryPoints.barWidget == "desktop/plugin/BarWidget.qml")
          ' manifest.json
          test -f "$(jq -r '.entryPoints.barWidget' manifest.json)"
          test "$(jq -r '.version' manifest.json)" = \
            "$(sed -nE 's/set\(PROJECT_VER "([^"]+)"\)/\1/p' firmware/CMakeLists.txt)"
          test "$(jq -r '.version' manifest.json)" = \
            "$(sed -nE 's/.*OMARCHY_FIRMWARE_VERSION_(MAJOR|MINOR|PATCH) = ([0-9]+),/\2/p' \
              firmware/main/watch_profile.h | paste -sd .)"
      - name: Check scripts and Python
        run: |
          bash -n desktop/install-local.sh
          bash -n desktop/uninstall-local.sh
          bash -n firmware/release/flash.sh
          bash -n tools/generate-fonts.sh
          bash -n tools/lint-plugin.sh
          bash -n tools/package-release.sh
          bash -n tools/render-watchface.sh
          bash -n tools/validate-plugin.sh
          python3 -m py_compile \
            desktop/manage_local.py \
            desktop/daemon/omarchy_watchd.py \
            desktop/bin/omarchy-watchctl
      - name: Run desktop tests
        run: |
          mkdir -p simulator/build
          cc -std=c11 -Wall -Wextra -Werror -I firmware/main \
            simulator/test_profile.c -o simulator/build/test-profile
          python3 -m unittest discover -s desktop/tests

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build firmware with ESP-IDF 5.5.5
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware
          command: |
            set -e
            idf.py build
            cmake -S ../simulator -B ../simulator/build
            cmake --build ../simulator/build --parallel 2
            ctest --test-dir ../simulator/build --output-on-failure
